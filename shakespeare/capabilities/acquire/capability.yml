id: acquire
version: "1.0.0"
standing_goal: Obtain the best available text for a set of files.
catalog: [doc.extract, text.normalize]
config_groups: [extract, confidence]
produces: [ExtractedContent]
# How many times it may reorganise before giving up. This is where a capability
# decides it has done part of the work and should carry on.
max_rounds: 6
# Measured, not guessed: this is what one item costs in output tokens.
cost_per_item: 320
divides: items
prompt_version: "1.3.0"
