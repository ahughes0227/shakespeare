[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shakespeare"
version = "0.1.0"
description = "Staged, transactional, agent-driven file operations runtime"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14,<2",
    "copier>=9.4,<10",
    "extract-msg>=0.54,<1",
    "fastuuid",
    "filelock>=3.16,<4",
    "hydra-core>=1.3.5,<1.4",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langsmith>=0.4,<1",
    "litellm>=1.80,<2",
    "openpyxl>=3.1,<4",
    # Pure-Python stand-ins, not the PyPI packages of the same name; see
    # `compat/` and `docs/adr/0006-free-threaded-python-only.md`.
    "orjson",
    "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
    "opentelemetry-sdk>=1.29,<2",
    "pdfplumber>=0.11,<1",
    "pillow>=11,<12",
    "platformdirs>=4.3,<5",
    "pydantic>=2.7,<3",
    "pytesseract>=0.3.13,<1",
    "python-docx>=1.1,<2",
    "pyarrow>=22,<26",
    "pyyaml>=6,<7",
    "rich>=13.9,<15",
    "sqlalchemy>=2.0,<3",
    "tenacity>=9,<10",
    "tokenizers",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
optimize = ["dspy>=2.6,<4"]

[project.scripts]
shakespeare = "system.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
    "types-PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["system*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["system", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# A frozen schema snapshot. Column definitions are legitimately wide, and rewrapping a
# generated baseline makes it harder to diff against the models it froze.
"system/runtime/audit/migrations/versions/*" = ["E501"]

[tool.mypy]
exclude = [
    # The component template's files are rendered into a package, not imported from here:
    # type-checking them in place checks a stencil rather than anything that runs.
    "system/components/template/",
    # setuptools leaves a copy of each stand-in here; checking both is a name collision.
    "compat/.*/build/",
]
python_version = "3.14"
strict = true
warn_unreachable = true
pretty = true
ignore_missing_imports = true

# Three of the accelerators in our dependency tree have no free-threaded build, and none
# of the three can simply be dropped: `langgraph_sdk`, `litellm.utils` and `litellm._uuid`
# each import one at module scope. orjson's build script refuses a free-threaded
# interpreter; tokenizers and fastuuid ship abi3 wheels, which do not exist for one. All
# three resolve to the pure-Python stand-ins in `compat/` instead of to PyPI. See
# `docs/adr/0006-free-threaded-python-only.md`.
[tool.uv.sources]
fastuuid = { path = "compat/fastuuid" }
orjson = { path = "compat/orjson" }
tokenizers = { path = "compat/tokenizers" }
