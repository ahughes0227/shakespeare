[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shakespeare"
version = "0.1.0"
description = "Staged, transactional, agent-driven file operations runtime"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "copier>=9.4,<10",
    "extract-msg>=0.54,<1",
    "filelock>=3.16,<4",
    "hydra-core>=1.3.5,<1.4",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langsmith>=0.4,<1",
    "litellm>=1.80,<2",
    "openpyxl>=3.1,<4",
    "pdfplumber>=0.11,<1",
    "pillow>=11,<12",
    "platformdirs>=4.3,<5",
    "pydantic>=2.7,<3",
    "pytesseract>=0.3.13,<1",
    "python-docx>=1.1,<2",
    "pyyaml>=6,<7",
    "rich>=13.9,<15",
    "sqlalchemy>=2.0,<3",
    "tenacity>=9,<10",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
optimize = ["dspy>=2.6,<4"]

[project.scripts]
shakespeare = "shakespeare.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shakespeare*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["shakespeare", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
ignore_missing_imports = true
