[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orjson"
# The upstream release this stands in for. The version is what LangGraph, the LangGraph
# SDK and LangSmith resolve against, so it has to satisfy their floors rather than
# describe this file.
version = "3.12.0"
description = "Pure-Python stand-in for orjson, for free-threaded CPython (see docs/adr/0006-free-threaded-python-only.md)"
requires-python = ">=3.14"

[tool.setuptools]
py-modules = ["orjson"]
