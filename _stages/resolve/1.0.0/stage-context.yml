purpose: Supply the field values the frozen convention declares, per item.
lifecycle: One resolution pass per attempt; low-confidence items are quarantined.
contracts: NamingSpec plus ExtractedContent in; rendered candidate names out.
allowed_configuration: Naming policy and the confidence floor.
side_effects: None.
risks: Guessing a value rather than quarantining, or misreading a scanned document.
failure_modes: Missing required field, unformattable value, confidence below the floor.
resource_limits: One model call per item under a one-hour wall clock.
examples: Reading vendor, invoice number and PO number from an invoice's text.
provenance: Per-item provenance spans and the frozen spec digest.
