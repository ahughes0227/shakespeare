name: resolve
version: "1.0.0"
purpose: Resolve each file's field values against the frozen convention.
goal: Every item has values meeting the confidence floor, or a quarantine reason.
input_contract: NamingSpec
output_contract: FieldValues
max_attempts: 2
domains:
  - id: field_resolution
    scope: Read extracted text and supply the declared field values for each item.
    # Skippable: a purely sequential convention needs no per-file extraction at all.
    skippable: true
    catalog: [text.normalize, name.render]
    config_groups: [naming, confidence]
    prompt_version: "1.0.0"
obligations: []
budget:
  operator_calls: "6 + 2*n"
  model_invocations: "4 + 1*n"
  wall_time_seconds: 3600
side_effects: []
