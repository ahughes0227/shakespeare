name: intake
version: "1.0.0"
purpose: Validate the request and inventory the input tree.
goal: Every file under the input root is inventoried, or listed with a reason.
input_contract: RequestContract
output_contract: FileInventory
max_attempts: 2
domains:
  - id: file_validity
    scope: Walk the input root and inventory every file with its digest and media type.
    skippable: false
    catalog: [fs.scan, fs.dirs]
    prompt_version: "1.0.0"
  - id: safety_preflight
    scope: Confirm the inventory contains nothing that should not be processed.
    # Non-skippable: a safety check must not be plannable away.
    skippable: false
    catalog: [fs.dirs]
    prompt_version: "1.0.0"
obligations: []
budget:
  operator_calls: "8 + 1*n"
  model_invocations: "4"
  wall_time_seconds: 600
side_effects: []
