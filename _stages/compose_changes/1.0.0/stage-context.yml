purpose: Turn rendered candidate names into a balanced, collision-free change plan.
lifecycle: One assembly per attempt; an unbalanced plan is refused, never trimmed.
contracts: Rendered names in; a ChangePlan out, every item in exactly one state.
allowed_configuration: Collision policy.
side_effects: None. The runtime materialises staging after this stage is accepted.
risks: Dropping an item, colliding targets, or admitting a hand-written filename.
failure_modes: Unbalanced accounting, unresolved collision, missing quarantine reason.
resource_limits: A short wall clock; assembly is pure computation.
examples: Suffixing two invoices that render to the same name in one folder.
provenance: Operator versions and the plan digest recorded in the audit log.
