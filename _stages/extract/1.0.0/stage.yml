name: extract
version: "1.0.0"
purpose: Acquire text and provenance from every inventoried file.
goal: Every inventoried file has usable text, or a recorded reason it does not.
input_contract: FileInventory
output_contract: ExtractedContent
max_attempts: 2
domains:
  - id: content_acquisition
    scope: Obtain the best available text for every file, choosing an extraction backend.
    skippable: false
    catalog: [doc.extract, text.normalize]
    config_groups: [extract, confidence]
    prompt_version: "1.0.0"
obligations: [every_item_has_text_or_reason]
budget:
  operator_calls: "6 + 2*n"
  model_invocations: "4"
  wall_time_seconds: 1800
side_effects: [workspace_artifacts]
