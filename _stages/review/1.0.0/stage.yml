name: review
version: "1.0.0"
purpose: Verify the staged tree against the plan before anything is committed.
goal: The staged tree matches the plan exactly and the structure mirrors the input.
input_contract: ChangePlan
output_contract: ReviewEvidence
max_attempts: 2
domains:
  - id: structural_review
    scope: Re-scan the staged tree and compare it against the plan.
    # Non-skippable: this is the evidence the commit gate rests on.
    skippable: false
    catalog: [fs.verify, fs.dirs]
    prompt_version: "1.0.0"
  - id: exception_review
    scope: Summarise quarantined items so a human can see what was not resolved.
    skippable: true
    catalog: [fs.dirs]
    prompt_version: "1.0.0"
obligations: []
budget:
  operator_calls: "6 + 1*n"
  model_invocations: "4"
  wall_time_seconds: 1800
side_effects: []
