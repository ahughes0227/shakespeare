purpose: Verify a staged tree against its plan and surface what was not resolved.
lifecycle: Re-scans staging, compares against the plan, summarises exceptions.
contracts: A ChangePlan and the staged tree in; a ReviewEvidence artifact out.
allowed_configuration: None; verification is not configurable.
side_effects: None. Verification reads the tree it is checking.
risks: Passing a tree that does not match the plan, or missing an extra file.
failure_modes: Missing file, digest mismatch, unexpected file, structure divergence.
resource_limits: One re-scan per round.
examples: Catching a truncated copy before it is committed to the output root.
provenance: The verification report digest, recorded before any commit.
